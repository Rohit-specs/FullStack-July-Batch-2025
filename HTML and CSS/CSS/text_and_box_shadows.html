<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shadows in text and box</title>
    <style>
        h1{
            text-shadow: 4px 2px 3px rgba(255, 0, 0, 0.651), -4px -2px 3px rgba(77, 90, 204, 0.651);
        }
        #box1{
            width: 100px;
            height: 100px;
            background-color: rgb(207, 222, 235);
            box-shadow: 3px 3px 7px; 
        }
    </style>
</head>
<body>
    <h1>ROHIT</h1>
    <div id="box1">

    </div>
    
</body>
</html>
