<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masking</title>
    <style>
        .img1{
            mask-image: linear-gradient(black 40%,transparent);
        }
        .img2{
            /* mask-image: url(./assets/colorful-transparent-soap-bubble-isolated-on-transparent-background-free-png.png); */
            mask-image: url(https://pngtree.com/free-png-vectors/green-blob);
        }

    </style>
</head>
<body>

    <div class="img1"><img src="cat_img.jpg" alt=""></div>
    <div class="img2"><img src="cat_img.jpg" alt=""></div>

    
</body>
</html>
