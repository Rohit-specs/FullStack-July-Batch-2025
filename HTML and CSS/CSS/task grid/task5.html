<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <style>
        .container{
            display: grid;
            width: 60%;
            aspect-ratio: 1/.8;
            margin: auto;
            gap: 5px;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows: repeat(6,1fr);
            
        }
        .container>div{
            border: 2px solid ;
            font-size: 1.5em;
            text-align: center;
        }
        .one{
            grid-row: 1/3;
            grid-column: 1/2;
        }
        .two{
            grid-row: 1/2;
            grid-column: 2/4;
        }
        .five{
            grid-column: 3/5;
        }
        .seven{
            grid-column: 2/4;
        }
        .ten{
            grid-column: 4/5;
            grid-row: 3/5;
        }
        .eleven{
            grid-row: 5/7;
        }
        .eight{
            grid-column: 1/3;
        }
        .twelve{
            grid-column: 2/4;
        }
        .fifteen{
            grid-column: 3/5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
        <div class="four">4</div>
        <div class="five">5</div>
        <div class="six">6</div>
        <div class="seven">7</div>
        <div class="eight">8</div>
        <div class="nine">9</div>
        <div class="ten">10</div>
        <div class="eleven">11</div>
        <div class="twelve">12</div>
        <div class="thirteen">13</div>
        <div class="fourteen">14</div>
        <div class="fifteen">15</div>
    </div>
    
</body>
</html>
