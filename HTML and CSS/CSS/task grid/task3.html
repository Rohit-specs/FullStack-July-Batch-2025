<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(3,40px);
            gap: 20px;
        }
        .container>*{
            border-radius: 12px;
            background-color: rgb(41, 79, 104);
            color: rgb(255, 249, 238);
            padding: 10px;
            align-self: center;
        }
        .child1{
            grid-column: 1/4;
            grid-row: 1/2;
        }
        .child2{
            grid-column: 1/2;
            grid-row: 2/3;
        }
        .child3{
            grid-column: 2/4;
            grid-row: 2/3;
        }
        .child4{
            grid-column: 2/4;
            grid-row: 3/4;
        }
    </style>

</head>
<body>
    
    <div class="container">
        <div class="child1">One</div>
        <div class="child2">Two</div>
        <div class="child3">Three</div>
        <div class="child4">Four</div>
    </div>

</body>
</html>
