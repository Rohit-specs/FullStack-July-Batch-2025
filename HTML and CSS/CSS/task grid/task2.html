<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
    <style>
    
        .grid{
            display: grid;
            position: relative;
            grid-template-columns: 400px;
            grid-template-rows: 200px;
        }
        .grid>div{
            grid-row: 1/2;
            grid-column: 1/2;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            padding: 20px;
        }
        .one{
            background-color: rgba(38, 129, 190, 0.747);
            border: 2px solid rgb(38, 129, 190);
        }
        .two{
            position: relative;
            background-color: rgba(255, 99, 71, 0.781);
            border: 2px solid tomato;
            top: 50%;
            left: 50%;
        }

    </style>
</head>
<body>
    
    <div class="grid">
        <div class="child one">One</div>
        <div class="child two">Two</div>
    </div>

</body>
</html>
