<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border in CSS</title>
    <style>
        h1{
            border-style: dashed;
            border-width: 2px;
            border-color: rgb(67, 179, 32);
            border-radius: 20px;
        }
        p{
            border-bottom: 2px solid rgb(224, 139, 11);
            border-top: 2px dotted rgb(219, 43, 235);
            border-left: 2px dashed rgb(46, 22, 177);
            border-right: 2px double rgb(223, 37, 53);
            border-radius: 4px;
        }
    </style>

</head>
<body>

    <h1>Border</h1>
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Recusandae temporibus quis ab doloremque facilis dolorum natus nulla vel exercitationem sequi non voluptatem nemo, expedita, laborum fugiat, praesentium ad accusamus similique.</p>
    
</body>
</html>
