<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display</title>
    <style>
        .inline{
            display: inline;
            width: 50px;
        }
        .block{
            display: block;
        }
        .d-none{
            display: none;
            /* hides the element with its space */
        }
        .box{
            width: 100px;
            aspect-ratio: 1/1;
            background-color: darkseagreen;
            border: 2px solid black;
            /* display: inline-block; */
        }
        .d-flex{
            display: flex;
            flex-direction: column;
            
        }
        .d-grid{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 100px 100px 100px;
        }
        .grid-item{
            background-color: rgb(58, 204, 14);
            border: 1px dashed rgb(0, 0, 0);
        }
        .grid-item1{
            background-color: rgb(51, 51, 219);
            grid-row: 1/ span 2;
            grid-column: 1/ span 2;
        }
        .grid-item2{
            background-color: rgb(26, 180, 129);
            grid-column: 3/ span 1;
            grid-row: 1/ span 3;
        }
        .grid-item3{
            background-color: rgb(195, 8, 219);
            grid-column: 1/ span 2;
            grid-row: 3/ span 1;
        }
        .grid-item5{
            background-color: rgb(198, 219, 8);
            grid-column: 1/ span 1;
            grid-row: 4/ span 1;
        }
        .grid-item4{
            background-color: rgba(201, 35, 13, 0.74);
            grid-column: 2/ span 2;
            grid-row: 4/ span 1;
        }
        .buttons{
            padding: 15px;
        }
        button{
            background-color: rgb(183, 194, 194);
            color: rgb(255, 0, 0);
            border: none;
            padding: 10px;
            box-shadow: 5px 5px 30px rgb(141, 109, 27),-4px -4px 30px rgb(62, 133, 103);
            border-radius: 6px;
        }
        button:focus{
            outline: 1px solid rgba(8, 70, 128, 0.678);
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <header><h1>Display</h1></header>
    <main>
        <h2 class="d-none" aria-hidden="true">Display Properties</h2>
        <section>
            <span class="block">SPAN</span>
            <div class="inline">DIV</div>
        </section>
        <h2>Display Flex</h2>
        <section class="box-wrapper d-flex">
            <div class="box">Box 1</div>
            <div class="box">Box 2</div>
            <div class="box">Box 3</div>
            <div class="box">Box 4</div>
            <div class="box">Box 5</div>
            
        </section>
        <h2>Display Grid</h2>
        <section class="box-wrapper d-grid">
            <div class="grid-item grid-item1">Box 1</div>
            <div class="grid-item grid-item2">Box 2</div>
            <div class="grid-item grid-item3">Box 3</div>
            <div class="grid-item grid-item4">Box 4</div>
            <div class="grid-item grid-item5">Box 5</div>

        </section>
        <div class="buttons">
            <button>click here</button>
            <button>not here</button>
        </div>
        
    </main>

    
</body>
</html>
