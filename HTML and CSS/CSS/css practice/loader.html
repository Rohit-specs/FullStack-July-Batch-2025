<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loader</title>
    <style>
        .spinner{
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 6px solid black;
            border-top: 6px solid transparent;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="spinner">

    </div>
    
</body>
</html>
