<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <style>
        *{
            box-sizing: border-box;
        }
        .parent{
            border: 1px solid rgba(0, 0, 255, 0.5);
            display: flex;
            border-radius: 5px;
            margin: auto;
            width: 500px;
            height: 500px;
            justify-content: center;
        }
        .child{
            align-self: center;
            padding: 6px 12px 6px 4px;
            background-color: rgba(0, 0, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">
            Center me.
        </div>
    </div>
    
</body>
</html>
