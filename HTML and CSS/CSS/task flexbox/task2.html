<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
        }
        .container{
            display: flex;
            border: 1px solid rgba(0, 0, 255, 0.5);
            padding: 3px;
            justify-content: center;
            width: 500px;
        }
        .box{
            font-size: 1.3em;
            width: calc((500px )/3);
            align-items: stretch;
            padding: 6px;
            background-color: rgba(0, 0, 255, 0.5);
            border: 1px solid rgba(29, 115, 155, 0.596);
            border-radius: 4px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">I am small</div>
        <div class="box">I have more content than the very small item.</div>
        <div class="box">I have lots of content.
            so much content that i don't know where it is all going to go. I'm glad that CSS is pretty good at dealing with situations where we end up with more words than expected!
        </div>
    </div>
</body>
</html>
