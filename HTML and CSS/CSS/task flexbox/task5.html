<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
        }
        .container{
            display: flex;
            flex-direction: row;
            /* height: 98vh ; */
            /* height: max-content; */
            width: 100vw;
            border: 1px solid rgba(128, 128, 128, 0.5);
            border-radius: 7px;
            overflow: hidden;
        }
        .left_container{
            background-color: rgba(0, 0, 0, 0.89);
            justify-content: left;
            width: 20%; 
        }
        .content{
            padding: 10px 20px;
            display: flex;
            overflow: hidden;
            flex-direction: column;
            flex: 1 1 auto;
            row-gap: 40px;
        }

        .box{

            width: 100%;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            padding: 20px;
            min-height: 180px;
        }
        
        .box1 ,.box3{
            background-color: rgba(128, 128, 128, 0.5);

        }
        .box1,.box3,.box2{
            height: 20%;
        }
        .content .box2{
            display: flex;
            column-gap: 20px;
            flex-grow: 1;
            flex-direction: row;
            justify-content: space-between;
            padding: 0;

        }
        .box2_left{
            display: flex;
            gap: 20px;
            flex-direction: column;
            justify-content: space-evenly;
            flex: 1;
        }
        .box2_left_top{
            display: flex;
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(128, 128, 128, 5);
            border-radius: 12px;
            background-color: white;
            gap: 10px;
            flex: 1;
        }
        
        .box2_left_top .child_boxes{
            width: calc(100%/3);
            background-color: rgba(128, 128, 128, 0.5);
            border: 1px solid rgba(128, 128, 128, 0.5);
            aspect-ratio: 1/1;
            border-radius: 8px;
        }
        .box2_left_bottom{
            display: flex;
            width: 80%;
            height: calc((50%)-10px);
            padding: 8px;
            border: 1px solid rgba(128, 128, 128, 5);
            border-radius: 12px;
            gap: 10px;
        }
        .box2_left_bottom div{
            background-color: rgba(128, 128, 128, 0.5);
            width: 50%;
            aspect-ratio: 1/.8;
            border-radius: 12px ;
        }
        .box2_left_bottom .child_box2{
            height: 80%;
            margin: auto;   
        }
        .box2_right{
            border: 1px solid rgba(128, 128, 128, 0.5);
            border-radius: 12px;
            width: 100%;
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .box2_right .box2_right_top{
            width: 100%;
            height: 45%;
            background-color: rgba(128, 128, 128, 0.5);
        }
        .box2_right .box2_right_bottom{
            width: 100%;
            flex: 1;
        }
        .box3{
            display: flex;
            display: column;
            column-gap: 10px;
            justify-content: center;
        }
        .box3>div{
            width: calc(100%/6);
            background-color: rgba(68, 64, 64, 0.63);
            border-radius: 12px;
            
        }
        .box3_1{
            height: 70%;
        }
        .box3_2{
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .box3_2 .box1{

            height: 60%;
        }
        .box3_2 .box2{
            order: 1;
            height: 40%;
            background-color: aliceblue;
        }
        .box3 .box3_4{
            background-color: rgb(255, 255, 255);
        }
        .box3 .box3_5{
            background-color: rgb(255, 255, 255);
            height: 60%;
            width: 80px;
            align-self: center;
        }
        



        
    </style>
</head>
<body>
    <div class="container">
        <div class="left_container"></div>
        <div class="content">
            <div class="box1 box"></div>
            <div class="box2 box" >
                <div class="box2_left">
                    <div class="box2_left_top">
                        <div class="child_boxes"></div>
                        <div class="child_boxes"></div>
                        <div class="child_boxes"></div>
                    </div>
                    <div class="box2_left_bottom">
                        <div class="child_box1"></div>
                        <div class="child_box2"></div>
                    </div>

                </div>
                <div class="box2_right">
                    <div class="box2_right_top"></div>
                    <div class="box2_right_bottom"></div>
                </div>

            </div>
            <div class="box3 box">
                <div class="box3_1"></div>
                <div class="box3_2">
                    <div class="box1"></div>
                    <div class="box2"></div>
                </div>
                <div class="box3_3"></div>
                <div class="box3_4"></div>
                <div class="box3_5"></div>
            </div>
        </div>
    </div>
</body>
</html>
