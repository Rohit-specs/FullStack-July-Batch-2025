<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Image,table and list</title>
</head>
<body>
    <header>

        <img src="image/beautiful-fall-nature-scenery-free-image.webp" alt="alternate text" loading="lazy">
        <figcaption>
            <a href="https://picjumbo.com/free-images/nature/">Image taken from</a>

    </section>
    <h2>Tables</h2>
    <section>
        <table border="5">
        <thead>
            <tr>
            <td>S.no</td>
            <td>Employee Name</td>
            <td>Desigination</td>
            <td>Salary</td>
        </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>

                <td>100000</td>
            </tr>
            <tr>
                <td>2</td>

            </tr>
        </tbody>
        <tfoot>

                <th colspan="3">Total</th>

            </tr>
        </tfoot>
    </table>
    </section>
    
    </main>
    
</body>
</html>
